[package]
name = "slogr-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Generate typed slogr attributes from OpenTelemetry Weaver registries"
license = "Apache-2.0"
readme = "README.md"
keywords = ["logging", "opentelemetry", "weaver", "codegen"]
categories = ["development-tools::build-utils"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
