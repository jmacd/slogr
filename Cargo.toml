[package]
name = "slogr"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Bounded, direct-to-protobuf structured logging for tracing"
license = "Apache-2.0"
readme = "README.md"
keywords = ["logging", "tracing", "structured", "protobuf", "opentelemetry"]
categories = ["development-tools::debugging"]

[dependencies]
bytes = "1.11.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
